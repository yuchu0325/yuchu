<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yu Chu — 2D Animator & Illustrator</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #141414;
      --muted: #8b8680;
      --pad: clamp(20px, 4vw, 64px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img, video { display: block; }

    .brand {
      position: fixed;
      top: var(--pad);
      left: var(--pad);
      z-index: 102;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink);
      pointer-events: none;
      user-select: none;
    }

    .menu-toggle {
      position: fixed;
      top: calc(var(--pad) - 6px);
      right: var(--pad);
      z-index: 102;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .menu-toggle span {
      display: block;
      width: 22px;
      height: 1px;
      background: var(--ink);
      transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1),
                  opacity 0.25s ease;
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .menu {
      position: fixed;
      top: calc(var(--pad) + 40px);
      right: var(--pad);
      z-index: 101;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      pointer-events: none;
    }

    .menu a {
      opacity: 0;
      transform: translateY(-8px);
      width: fit-content;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      transition: opacity 0.3s ease,
                  transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1),
                  color 0.2s;
    }

    .menu.open { pointer-events: auto; }
    .menu.open a { opacity: 1; transform: none; }
    .menu.open a:nth-child(1) { transition-delay: 0.02s; }
    .menu.open a:nth-child(2) { transition-delay: 0.05s; }
    .menu.open a:nth-child(3) { transition-delay: 0.08s; }
    .menu.open a:nth-child(4) { transition-delay: 0.11s; }
    .menu.open a:nth-child(5) { transition-delay: 0.14s; }

    .menu a:hover,
    .menu a.current { color: var(--ink); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scrim.show { opacity: 1; pointer-events: auto; }

    main { padding-top: clamp(96px, 14vw, 160px); }

    .view { display: none; }
    .view.active {
      display: block;
      animation: fadeUp 0.55s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .gallery-intro {
      padding: 0 var(--pad) clamp(40px, 6vw, 80px);
    }

    .gallery-intro p {
      margin: 0;
      max-width: 1000px;
      font-size: clamp(26px, 4.5vw, 56px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 400;
    }

    .gallery {
      columns: 2;
      column-gap: clamp(16px, 2.5vw, 32px);
      padding: 0 var(--pad) var(--pad);
    }

    /* ---------- 单列居中（Animation 用） ---------- */
    .gallery-single {
      columns: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(24px, 4vw, 48px);
    }

    .gallery-single .item {
      width: 100%;
      max-width: 1000px;
      margin: 0;
    }

    .item {
      break-inside: avoid;
      margin: 0 0 clamp(18px, 2.5vw, 34px);
    }

    .item img {
      width: 100%;
      height: auto;
      background: #f0f0f0;
    }

    .item figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .item-desc {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    .video-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .reel-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 var(--pad) var(--pad);
    }

    .video-caption {
      margin: 18px 0 0;
      max-width: 760px;
      font-size: clamp(13px, 1.2vw, 15px);
      line-height: 1.65;
      color: var(--muted);
    }

    .contact-inner {
      max-width: 1100px;
      padding: 0 var(--pad) var(--pad);
    }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid currentColor;
      font-size: clamp(16px, 2vw, 24px);
    }

    .email svg { flex: none; width: 1em; height: 1em; }

    @media (max-width: 700px) {
      .gallery { columns: 1; }
      .item figcaption { flex-direction: column; gap: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .view.active { animation: none; }
      .menu a, .menu-toggle span, .scrim { transition: none; }
    }
  </style>
</head>
<body>

  <div class="scrim" id="scrim"></div>
  <div class="brand">Yu Chu</div>

  <button
    class="menu-toggle"
    id="menuBtn"
    aria-expanded="false"
    aria-controls="menu"
    aria-label="Menu"
  >
    <span></span><span></span><span></span>
  </button>

  <nav class="menu" id="menu" aria-label="Main">
    <a href=" " data-link="gallery">Gallery</a >
    <a href="#animation" data-link="animation">Animation</a >
    <a href="#illustration" data-link="illustration">Illustration</a >
    <a href="#showreel" data-link="showreel">Showreel</a >
    <a href="#contact" data-link="contact">Contact</a >
  </nav>

  <main>

    <section class="view" data-view="gallery">
      <div class="gallery-intro">
        <p>I'm a freelance 2D animator, illustrator.</p >
      </div>
      <div class="gallery" id="gallery-grid"></div>
    </section>

    <!-- 注意这里加了 gallery-single -->
    <section class="view" data-view="animation">
      <div class="gallery gallery-single" id="animation-grid"></div>
    </section>

    <section class="view" data-view="illustration">
      <div class="gallery" id="illustration-grid"></div>
    </section>

    <section class="view" data-view="showreel">
      <div class="reel-wrap" id="showreel-wrap"></div>
    </section>

    <section class="view" data-view="contact">
      <div class="contact-inner">
        <a class="email" href="mailto:yuchu2003@outlook.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
          <span>yuchu2003@outlook.com</span>
        </a >
      </div>
    </section>

  </main>

  <script>
    /* =========================================================
       作品清单 —— 只需要改这里
       ========================================================= */

    const galleryList = Array.from({ length: 9 }, (_, i) => {
      const n = String(i + 1).padStart(2, '0');
      return { type: 'image', src: 'assets/gallery/' + n + '.PNG' };
    });

    const illustrationList = Array.from({ length: 15 }, (_, i) => {
      const n = String(i + 1).padStart(2, '0');
      return { type: 'image', src: 'assets/illustration/' + n + '.PNG' };
    });

    // Animation：只放一个视频，居中显示
    const animationList = [
      {
        type: 'video',
        vimeo: '1183790287',
        title: 'Snow',
        year: '2025',
     }
    ];

    // Showreel：只放一个视频，居中显示
    const showreel = {
      vimeo: '1248414822',
      title: 'Showreel 2026',
  };

    /* =========================================================
       下面是自动生成逻辑，不用改
       ========================================================= */

    function videoEmbed(id, title) {
      const src = 'https://player.vimeo.com/video/' + id + '?title=0&byline=0&portrait=0';
      return (
        '<div class="video-embed">' +
          '<iframe src="' + src + '" title="' + title + '" loading="lazy" ' +
          'allow="fullscreen; picture-in-picture" allowfullscreen></iframe>' +
        '</div>'
      );
    }

    function renderItem(item) {
      if (item.type === 'image') {
        return (
          '<figure class="item">' +
            '<img src="' + item.src + '" alt="" loading="lazy" />' +
          '</figure>'
        );
      }

      const desc = item.desc ? '<p class="item-desc">' + item.desc + '</p >' : '';
      return (
        '<figure class="item">' +
          videoEmbed(item.vimeo, item.title) +
          '<figcaption><span>' + item.title + '</span><span>' + item.year + '</span></figcaption>' +
          desc +
        '</figure>'
      );
    }

    function renderGrid(targetId, list) {
      document.getElementById(targetId).innerHTML = list.map(renderItem).join('');
    }

    renderGrid('gallery-grid', galleryList);
    renderGrid('animation-grid', animationList);
    renderGrid('illustration-grid', illustrationList);

    document.getElementById('showreel-wrap').innerHTML =
  videoEmbed(showreel.vimeo, showreel.title) +
  (showreel.caption ? '<p class="video-caption">' + showreel.caption + '</p >' : '');

    const menuBtn = document.getElementById('menuBtn');
    const menu = document.getElementById('menu');
    const scrim = document.getElementById('scrim');
    const links = Array.from(menu.querySelectorAll('a'));
    const views = Array.from(document.querySelectorAll('.view'));
    const valid = ['gallery', 'animation', 'illustration', 'showreel', 'contact'];

    function setMenu(open) {
      menu.classList.toggle('open', open);
      scrim.classList.toggle('show', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
    scrim.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenu(false);
    });
    links.forEach((a) => a.addEventListener('click', () => setMenu(false)));

    function route() {
      let name = decodeURIComponent(location.hash.replace(/^#/, '')) || 'gallery';
      if (!valid.includes(name)) name = 'gallery';

      views.forEach((v) => v.classList.toggle('active', v.dataset.view === name));
      links.forEach((a) => a.classList.toggle('current', a.dataset.link === name));

      setMenu(false);
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    window.addEventListener('hashchange', route);
    route();
  </script>

</body>
</html>
